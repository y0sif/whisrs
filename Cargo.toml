[workspace]
resolver = "2"
members = [
    ".",
    "crates/asr-dedup",
    "crates/prompt-echo",
    "crates/xkb-type",
    "crates/audio-silence-gate",
    "crates/filler-remove",
]

[package]
name = "whisrs"
version = "0.1.27"
edition = "2021"
description = "Voice for the Linux desktop: dictation, read-aloud (TTS), and voice-driven LLM commands, with Groq, OpenAI, Deepgram, and local Whisper backends"
license = "MIT"
repository = "https://github.com/y0sif/whisrs"
homepage = "https://y0sif.github.io/whisrs/"
keywords = ["voice", "dictation", "speech-to-text", "whisper", "linux"]
categories = ["multimedia::audio", "accessibility", "command-line-utilities"]
readme = "README.md"
exclude = ["assets/"]

[package.metadata.docs.rs]
all-features = false
features = []

[[bin]]
name = "whisrs"
path = "src/cli/main.rs"

[[bin]]
name = "whisrsd"
path = "src/daemon/main.rs"

[[example]]
name = "issue55_stream_check"
required-features = ["local-whisper"]

[features]
default = ["local-whisper", "tray", "overlay", "hooks"]
local-whisper = ["dep:whisper-rs"]
tray = ["dep:ksni"]
overlay = ["dep:smithay-client-toolkit", "dep:wayland-client", "dep:tiny-skia", "dep:zbus"]
hooks = ["dep:zbus"]
# GPU backends for the bundled whisper.cpp. Opt-in at build time — the backend
# has to be linked in, so there is no runtime switch — and CPU stays the default.
# The `whisper-rs?/…` weak syntax applies the feature to whisper-rs without
# itself enabling the optional dependency; `local-whisper` is what pulls it in,
# so builds that never enable it stay free of whisper-rs.
vulkan = ["local-whisper", "whisper-rs?/vulkan"]
cuda = ["local-whisper", "whisper-rs?/cuda"]
hipblas = ["local-whisper", "whisper-rs?/hipblas"]

[dependencies]
anyhow = "1"
asr-dedup = { path = "crates/asr-dedup", version = "0.1" }
audio-silence-gate = { path = "crates/audio-silence-gate", version = "0.1" }
filler-remove = { path = "crates/filler-remove", version = "0.1" }
prompt-echo = { path = "crates/prompt-echo", version = "0.1" }
xkb-type = { path = "crates/xkb-type", version = "0.1.4", features = ["arboard", "wayland-vk"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
dialoguer = "0.11"
dirs = "6"
evdev = { version = "0.12", features = ["tokio"] }
futures-util = "0.3"
hound = "3"
libc = "0.2"
notify-rust = "4"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swayipc = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
# Format-preserving config rewrites (issue #82). Kept on 0.22 so it shares the
# exact toml_edit build that `toml 0.8` already pulls in — no new dependency tree.
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = { version = "0.13", features = ["randr", "shape"] }
zbus = { version = "5", optional = true }

[dependencies.ksni]
version = "0.3"
optional = true

[dependencies.smithay-client-toolkit]
version = "0.19"
optional = true

[dependencies.wayland-client]
version = "0.31"
optional = true

[dependencies.tiny-skia]
version = "0.12"
optional = true
default-features = false
features = ["std", "simd"]

[dependencies.whisper-rs]
version = "0.16"
optional = true

[dev-dependencies]
tempfile = "3"
# start_paused tests need tokio's paused clock ("test-util" is not in "full").
tokio = { version = "1", features = ["test-util"] }
