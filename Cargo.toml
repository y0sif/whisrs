[workspace]
resolver = "2"
members = [
    ".",
    "crates/asr-dedup",
    "crates/prompt-echo",
    "crates/xkb-type",
    "crates/audio-silence-gate",
    "crates/filler-remove",
]

[package]
name = "whisrs"
version = "0.1.31"
edition = "2021"
description = "Voice for the Linux desktop: dictation, read-aloud (TTS), and voice-driven LLM commands, with Groq, OpenAI, Deepgram, and local Whisper backends"
license = "MIT"
repository = "https://github.com/y0sif/whisrs"
homepage = "https://y0sif.github.io/whisrs/"
keywords = ["voice", "dictation", "speech-to-text", "whisper", "linux"]
categories = ["multimedia::audio", "accessibility", "command-line-utilities"]
readme = "README.md"
exclude = ["assets/"]

[package.metadata.docs.rs]
all-features = false
features = []

[[bin]]
name = "whisrs"
path = "src/cli/main.rs"

[[bin]]
name = "whisrsd"
path = "src/daemon/main.rs"

[[example]]
name = "issue55_stream_check"
required-features = ["local-whisper"]

[[example]]
name = "issue208_batch_check"
required-features = ["local-whisper"]

[[example]]
name = "agent_overlay_frames"
required-features = ["overlay"]

[features]
default = ["local-whisper", "tray", "overlay", "hooks", "recording", "mcp"]
local-whisper = ["dep:whisper-rs"]
tray = ["dep:ksni", "dep:png"]
overlay = ["dep:smithay-client-toolkit", "dep:wayland-client", "dep:tiny-skia", "dep:fontdue", "dep:zbus"]
hooks = ["dep:zbus"]
# The recording feature: mic + system audio recordings transcribed after the
# stop, with speakers, names and summaries (`whisrs recording`, its tray items,
# `[recording]`). Without it, `whisrs recording` exits with an error, the
# daemon refuses the command, and a `[recording]` section or a `[hotkeys]
# recording` binding gets a config warning.
recording = ["dep:flacenc", "dep:realfft", "dep:bytes"]
# `whisrs mcp`: a read-only MCP server (stdio) over the recordings folder.
mcp = ["recording", "dep:rmcp", "dep:schemars"]
# GPU backends for the bundled whisper.cpp. Opt-in at build time — the backend
# has to be linked in, so there is no runtime switch — and CPU stays the default.
# The `whisper-rs?/…` weak syntax applies the feature to whisper-rs without
# itself enabling the optional dependency; `local-whisper` is what pulls it in,
# so builds that never enable it stay free of whisper-rs.
vulkan = ["local-whisper", "whisper-rs?/vulkan"]
cuda = ["local-whisper", "whisper-rs?/cuda"]
hipblas = ["local-whisper", "whisper-rs?/hipblas"]

[dependencies]
anyhow = "1"
asr-dedup = { path = "crates/asr-dedup", version = "0.1" }
audio-silence-gate = { path = "crates/audio-silence-gate", version = "0.1" }
filler-remove = { path = "crates/filler-remove", version = "0.1" }
prompt-echo = { path = "crates/prompt-echo", version = "0.1" }
xkb-type = { path = "crates/xkb-type", version = "0.2.0", features = ["arboard", "wayland-vk", "xtest"] }
async-trait = "0.1"
base64 = "0.22"
# Shares one upload buffer between the retries of a diarization sidecar
# request (feature `recording`). Already in the build through reqwest and hyper.
bytes = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.18", features = ["pulseaudio"] }
dirs = "6"
evdev = { version = "0.12", features = ["tokio"] }
# Recording uploads to cloud backends (lossless, less than half the WAV size).
# Default features off: no `par` thread pool, no serde, no log. Feature
# `recording`: without it a recording chunk would go as WAV, and none is sent.
flacenc = { version = "0.5.1", default-features = false, optional = true }
futures-util = "0.3"
hound = "3"
libc = "0.2"
notify-rust = "4"
# The `whisrs config` TUI, in the CLI binary only (whisrsd never uses it).
# Default features off: no calendar widget, macros or layout cache.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Echo removal on a recording's mic track (feature `recording`).
realfft = { version = "3.5", optional = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swayipc = "3"
# Asks the terminal for its colours (OSC 10/11) before the TUI starts: a
# light or dark background, and the real fg and bg the faint roles blend.
terminal-colorsaurus = "1.0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
# Format-preserving config rewrites (issue #82). Kept on 0.22 so it shares the
# exact toml_edit build that `toml 0.8` already pulls in — no new dependency tree.
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = { version = "0.13", features = ["randr", "shape"] }
zbus = { version = "5", optional = true }

[dependencies.ksni]
version = "0.3"
optional = true

# Decodes the embedded tray icons. Already in the build via arboard -> image,
# so this adds no new crate.
[dependencies.png]
version = "0.18"
optional = true

[dependencies.smithay-client-toolkit]
version = "0.19"
optional = true

[dependencies.wayland-client]
version = "0.31"
optional = true

[dependencies.tiny-skia]
version = "0.12"
optional = true
default-features = false
features = ["std", "simd"]

# The agent overlay's text (feature `overlay`). Pure Rust; default features
# off so it uses std's HashMap instead of a second hashbrown.
[dependencies.fontdue]
version = "0.9.5"
optional = true
default-features = false
features = ["std", "simd"]

[dependencies.whisper-rs]
version = "0.16"
optional = true

# The MCP server of `whisrs mcp`. Pinned to 3.5: the SDK has broken its API
# across majors (2.0, 3.0) and moves fast. Only the server, its tool macros
# and the stdio transport.
[dependencies.rmcp]
version = "~3.5.1"
optional = true
default-features = false
features = ["server", "macros", "transport-io"]

# Tool input and output schemas for `whisrs mcp`, the version rmcp uses.
[dependencies.schemars]
version = "1"
optional = true

[dev-dependencies]
# Decodes the FLAC recording uploads back to samples in tests.
claxon = "0.4"
tempfile = "3"
# start_paused tests need tokio's paused clock ("test-util" is not in "full").
tokio = { version = "1", features = ["test-util"] }
# PNG output for examples/agent_overlay_frames.rs. Dev only, so the binaries
# keep tiny-skia without its PNG encoder.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
