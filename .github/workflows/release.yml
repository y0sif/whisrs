name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build and check every artifact but never publish a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            arch: x86_64
            runner: ubuntu-latest
            artifact: whisrs-linux-x86_64
            features: ""
          - name: Linux x86_64 (no local-whisper)
            arch: x86_64
            runner: ubuntu-latest
            artifact: whisrs-linux-x86_64-minimal
            features: "--no-default-features --features tray,overlay,hooks,recording,mcp"
          - name: Linux aarch64
            arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: whisrs-linux-aarch64
            features: ""
          - name: Linux aarch64 (no local-whisper)
            arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: whisrs-linux-aarch64-minimal
            features: "--no-default-features --features tray,overlay,hooks,recording,mcp"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      # ggml defaults to -march=native (-mcpu=native on ARM), so an unpinned
      # build inherits the runner's ISA and SIGILLs on CPUs without it.
      # GGML_NATIVE=OFF turns that off. On x86_64, OFF alone gives an
      # x86-64-v3 floor (AVX2/BMI2/FMA/F16C, no AVX-512). On ARM, OFF alone adds
      # no -march, so GGML_CPU_ARM_ARCH sets the floor: ARMv8.2 with dotprod
      # and fp16 (Pi 5, Apple M1, Neoverse N1 and newer, not the Pi 4).
      - name: Pin CPU baseline
        run: |
          echo "GGML_NATIVE=OFF" >> "$GITHUB_ENV"
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            echo "GGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16" >> "$GITHUB_ENV"
          fi

      # whisper-rs-sys never reruns on GGML_* changes, so key the cache on them
      # or a restored target/ keeps the old ggml build.
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: GGML

      - name: Build
        run: cargo build --release ${{ matrix.features }}

      - name: Check CPU baseline
        run: scripts/check-cpu-baseline.sh

      - name: Package
        run: |
          mkdir -p staging
          cp target/release/whisrs staging/
          cp target/release/whisrsd staging/
          cp README.md LICENSE staging/
          cp -r contrib staging/
          cd staging
          tar czf ../${{ matrix.artifact }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Create Release
    needs: build
    # Tag pushes only: a manual run started from a tag must not re-upload assets.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
