[package]
name = "xkb-type"
version = "0.2.2"
edition = "2021"
rust-version = "1.74"
description = "Virtual keyboard typing via evdev/uinput or X11 XTEST with XKB layout-aware key mapping"
license = "MIT"
repository = "https://github.com/y0sif/whisrs"
readme = "README.md"
keywords = ["keyboard", "uinput", "xkb", "x11", "wayland"]
categories = ["os::linux-apis", "hardware-support"]

[features]
default = []
logging = ["dep:log"]
arboard = ["dep:arboard", "dep:x11rb"]
wayland-vk = ["dep:wayland-client", "dep:wayland-protocols-misc", "dep:rustix"]
xtest = ["dep:x11rb"]

[dependencies]
evdev = "0.12"
xkbcommon = "0.8"
anyhow = "1"
serde_json = "1"
log = { version = "0.4", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-misc = { version = "0.3", features = ["client"], optional = true }
rustix = { version = "0.38", features = ["fs"], optional = true }
x11rb = { version = "0.13", features = ["xinput", "xkb", "xtest"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", optional = true }
