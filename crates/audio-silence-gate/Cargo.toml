[package]
name = "audio-silence-gate"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Speech detection for audio capture: the earshot VAD with level floors and hangover, an RMS gate, auto-stop and a level meter"
repository = "https://github.com/y0sif/whisrs/tree/main/crates/audio-silence-gate"
license = "MIT"
readme = "README.md"
keywords = ["audio", "vad", "silence", "speech", "detection"]
categories = ["multimedia::audio"]

[dependencies]
# The learned detector (std only, no dependencies of its own). Patch releases
# only: the thresholds in `vad.rs` are tuned to these weights, so a new minor
# version must pass scripts/check-vad.sh before it is allowed in.
earshot = "~1.2.2"
